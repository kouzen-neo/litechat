org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M" -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
# Newer dependencies (compose material3 1.5.0-alpha25, material-kolor 5.0.0)
# declare compileSdk 37 in their AAR metadata, but Google has not published
# the android-37 platform publicly. Disable the strict new metadata check so
# the project can keep compiling against 36 until the platform ships.
android.enableNewAarMetadataCheck=false
