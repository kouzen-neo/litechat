name: Build release APK (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 platform + build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0"

      - name: Build release APK (arm64-v8a)
        env:
          LITECHAT_KEYSTORE_STORE_PASSWORD: ${{ secrets.LITECHAT_KEYSTORE_STORE_PASSWORD }}
          LITECHAT_KEYSTORE_KEY_PASSWORD: ${{ secrets.LITECHAT_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PabiFilter=arm64-v8a --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litechat-release-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
